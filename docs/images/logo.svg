<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1626"/>
      <stop offset="100%" stop-color="#0d0b14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon: hexagonal "server/shield" mark with a subtle crack, evoking survival + control panel -->
  <g transform="translate(30, 30)">
    <polygon points="70,0 132,35 132,105 70,140 8,105 8,35"
             fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="3"/>
    <!-- inner circuit / control lines -->
    <path d="M40 70 L60 70 L68 55 L78 85 L88 70 L100 70"
          fill="none" stroke="url(#accentGrad)" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
    <circle cx="40" cy="70" r="4" fill="#a78bfa"/>
    <circle cx="100" cy="70" r="4" fill="#a78bfa"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="#f5f3ff">
    Zomboid
  </text>
  <text x="200" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="url(#accentGrad)">
    Manager
  </text>
  <text x="203" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#8b7fa8" letter-spacing="0.5">
    Dedicated Server Control for Project Zomboid
  </text>
</svg>
